services:
  backend:
    image: lox223/world-domination-backend:v0.1.0
    build:
      context: ./Back/WorldDominationSignalR/WorldDominationSignalR
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    expose:
      - "8080"

  frontend:
    image: lox223/world-domination-frontend:v0.1.0
    build:
      context: ./Client-side/vue-world-dom
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://frontend:80
    depends_on:
      - frontend